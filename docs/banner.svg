    @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .dash{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
    .shim{animation:shim 4s ease-in-out infinite}@keyframes shim{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
